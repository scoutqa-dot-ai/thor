# Isolated Pi E2E with a real broker/SDK MCP edge. Dummy-only, internal network, no host ports.
# Model/Slack/legacy wrapper fixtures are not real providers. Full mount gates also use docker/mcp-test.
services:
  init:
    # Prepared broker image supplies openssl; no install/build during cached checks.
    image: ${MCP_TEST_BROKER_IMAGE:-thor-pi-mcp-fixture:latest}
    entrypoint: []
    user: "0:0"
    volumes:
      - repos:/workspace/repos
      - worktrees:/workspace/worktrees
      - memory:/workspace/memory
      - worklog:/workspace/worklog
      - config:/workspace/config
      - catalog:/etc/thor/mcp-catalog
      - secrets:/run/secrets/thor-mcp
      - fixture-tls:/fixture-tls
      - fixture-ca:/fixture-ca
      - mcp-approval-state:/var/lib/remote-cli/mcp-approvals
      - ../../scripts/fixtures/pi-mcp-init.mjs:/mcp-init.mjs:ro
    command: [node, /mcp-init.mjs]

  model-fixture:
    image: node:24-slim
    volumes:
      - ../../scripts/fixtures/pi-responses.mjs:/fixture.mjs:ro
    command: [node, /fixture.mjs]
    networks:
      default:
        aliases: [vouch, codex-lb]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      timeout: 3s
      retries: 30

  mcp-fixture:
    image: ${MCP_TEST_BROKER_IMAGE:-thor-pi-mcp-fixture:latest}
    entrypoint: [node, /app/packages/remote-cli/mcp-fixture.mjs]
    environment:
      MCP_FIXTURE_TEAM: T_FIXTURE
      MCP_FIXTURE_USER: U_FIXTURE
      MCP_FIXTURE_TLS: "1"
    volumes:
      - ../../scripts/fixtures/mcp-catalog-server.mjs:/app/packages/remote-cli/mcp-fixture.mjs:ro
      - fixture-tls:/fixture-tls:ro
      - fixture-ca:/fixture-ca:ro
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      retries: 30

  remote-cli:
    build:
      context: ../..
      target: remote-cli
    image: ${MCP_TEST_BROKER_IMAGE:-thor-pi-mcp-fixture:latest}
    entrypoint: [node, /app/packages/remote-cli/dist/index.js]
    environment:
      PORT: "3004"
      NODE_ENV: production
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: dummy-fixture
      GITHUB_APP_BOT_ID: "1"
      GITHUB_APP_PRIVATE_KEY_FILE: /var/lib/remote-cli/github-app/dummy.pem
      GOOGLE_WORKSPACE_OAUTH_CLIENT_ID: dummy-client-id
      GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET: dummy-client-secret
      GOOGLE_WORKSPACE_OAUTH_PUBLIC_BASE_URL: https://dummy-neo.example
      GOOGLE_WORKSPACE_OAUTH_SCOPES: https://www.googleapis.com/auth/drive
      # Fixed 32-byte dummy fixture key, not an account/deployment credential.
      GOOGLE_WORKSPACE_OAUTH_ENCRYPTION_KEY: ERERERERERERERERERERERERERERERERERERERERERE=
      SLACK_BOT_TOKEN: dummy-slack-token
      SLACK_API_BASE_URL: http://mcp-fixture:8000/slack
      NODE_EXTRA_CA_CERTS: /fixture-ca/cert.pem
      SLACK_TEAM_ID: T_FIXTURE
      THOR_INTERNAL_SECRET: runner-internal-sentinel
      RUNNER_BASE_URL: http://runner:3000
    security_opt:
      - seccomp=../remote-cli/seccomp-bwrap.json
      - apparmor=unconfined
      - systempaths=unconfined
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - catalog:/etc/thor/mcp-catalog:ro
      - secrets:/run/secrets/thor-mcp:ro
      - fixture-ca:/fixture-ca:ro
      - mcp-approval-state:/var/lib/remote-cli/mcp-approvals
      - worklog:/workspace/worklog
      - config:/workspace/config:ro
      - ../../packages/remote-cli/dist:/app/packages/remote-cli/dist:ro
    depends_on:
      init: { condition: service_completed_successfully }
      mcp-fixture: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3004/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      retries: 30

  pi-executor:
    build:
      context: ../..
      target: pi-executor
    environment:
      PORT: "3002"
      THOR_REMOTE_CLI_URL: http://model-fixture:8000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - repos:/workspace/repos:ro
      - worktrees:/workspace/worktrees
      - memory:/workspace/memory
      - worklog:/workspace/worklog:ro
      - config:/workspace/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
      model-fixture:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      timeout: 3s
      retries: 30

  runner:
    build:
      context: ../..
      target: runner
    environment:
      THOR_RUNTIME: pi
      PI_EXECUTOR_URL: http://pi-executor:3002
      PI_STORAGE_PATH: /var/lib/runner/pi.sqlite
      PI_MODEL_BASE_URL: http://model-fixture:8000/v1
      RUNNER_BASE_URL: http://ingress:8080
      PI_MODEL_ID: fixture-model
      PI_MODEL_API_KEY: fixture-only
      PI_MODEL_CONTEXT_WINDOW: "65536"
      PI_MODEL_SUPPORTS_IMAGES: "true"
      PI_SKILLS_DIR: /etc/thor/skills
      PI_MEMORY_DIR: /workspace/memory
      # Sentinels must never reach tools. These are not real credentials.
      SLACK_BOT_TOKEN: runner-secret-sentinel
      THOR_INTERNAL_SECRET: runner-internal-sentinel
      SLACK_API_BASE_URL: http://model-fixture:8000/slack/
      SLACK_TEAM_ID: T_FIXTURE
    volumes:
      - state:/var/lib/runner
      - ../../scripts/fixtures/pi-mcp-lifecycle.mjs:/pi-mcp-lifecycle.mjs:ro
      - repos:/workspace/repos:ro
      - worktrees:/workspace/worktrees:ro
      - memory:/workspace/memory:ro
      - worklog:/workspace/worklog
      - config:/workspace/config:ro
    depends_on:
      pi-executor:
        condition: service_healthy
      remote-cli:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(r=>{if(r.runtime!=='pi')throw 1})",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  gateway:
    build:
      context: ../..
      target: gateway
    environment:
      RUNNER_URL: http://runner:3000
      THOR_INTERNAL_SECRET: runner-internal-sentinel
      SLACK_BOT_TOKEN: gateway-secret-sentinel
      SLACK_SIGNING_SECRET: fixture-signing-secret
      SLACK_BOT_USER_ID: UBOT
      SLACK_TEAM_ID: T_FIXTURE
      SLACK_DEFAULT_REPO: pi-fixture
      SLACK_API_BASE_URL: http://model-fixture:8000/slack/
      GITHUB_APP_SLUG: fixture
      GITHUB_APP_BOT_ID: "1"
      GITHUB_WEBHOOK_SECRET: fixture-webhook-secret
      REMOTE_CLI_HOST: remote-cli
      REMOTE_CLI_PORT: "3004"
      QUEUE_DIR: /workspace/worklog/gateway-queue
    volumes:
      - repos:/workspace/repos:ro
      - worklog:/workspace/worklog
      - memory:/workspace/memory:ro
      - config:/workspace/config:ro
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      timeout: 3s
      retries: 30

  admin:
    build:
      context: ../..
      target: admin
    volumes:
      - worklog:/workspace/worklog
      - config:/workspace/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3005/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 1s
      timeout: 3s
      retries: 30

  ingress:
    build:
      context: ../ingress
    environment:
      THOR_RUNTIME: pi
      THOR_ADMIN_EMAILS: fixture@example.com
      THOR_INTERNAL_SECRET: runner-internal-sentinel
      GOOGLE_WORKSPACE_OAUTH_PUBLIC_BASE_URL: http://ingress:8080
    depends_on:
      runner:
        condition: service_healthy
      admin:
        condition: service_healthy
      model-fixture:
        condition: service_healthy

      gateway:
        condition: service_healthy

volumes:
  repos:
  worktrees:
  memory:
  worklog:
  config:
  state:
  catalog:
  secrets:
  fixture-tls:
  fixture-ca:
  mcp-approval-state:

networks:
  default:
    internal: true
