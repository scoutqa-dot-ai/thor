# Test-only legacy CI overrides. Never use this file for a deployment.
services:
  falcon-mcp:
    image: node:24-slim
    entrypoint: !reset null
    command: !override [node, /fixture/falcon-mcp.mjs]
    environment: !override {}
    volumes:
      - ./scripts/fixtures/falcon-mcp.mjs:/fixture/falcon-mcp.mjs:ro
    healthcheck:
      test:
        !override [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)throw 1})",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 0s

  remote-cli:
    # Inherits the same broker-only generic approval state volume from base.
    # CI-only: command children now require rootless mounts, denied by docker-default AppArmor.
    # Keep the filesystem/PID/credential sandbox and seccomp; this is NOT the production MAC policy.
    # Credential browser bundle remains disabled in these legacy suites.
    security_opt: !override
      - seccomp=./docker/remote-cli/seccomp-bwrap.json
      - apparmor=unconfined
      - systempaths=unconfined
      - no-new-privileges:true
    environment:
      OP_SERVICE_ACCOUNT_TOKEN: ""
      ONEPASSWORD_BROWSER_VAULT_ID: ""
